<div class="container">
   
    
    <div class="booking-container">
        <h1>Book Your Trip</h1>
    
        <div class="package-preview">
            <img src="https://via.placeholder.com/450x250.png?text=Maldives+Getaway" alt="Trip Package">
            <h2>Maldives Getaway</h2>
            <p>7 Days | Beach & Relaxation | ₹1,20,000</p>
        </div>
    
        <form class="booking-form">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" placeholder="Enter your full name" required>
            </div>
    
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
    
            <div class="form-group">
                <label for="package">Select Package</label>
                <select id="package" required>
                    <option value="">--Choose a Package--</option>
                    <option value="maldives">Maldives Getaway</option>
                    <option value="bali">Bali Adventure</option>
                    <option value="swiss">Swiss Alps Tour</option>
                </select>
            </div>
    
            <div class="form-group">
                <label>Choose Payment Method</label>
                <div class="payment-methods">
                    <img src="https://img.icons8.com/ios-filled/50/000000/visa.png" alt="Visa">
                    <img src="https://img.icons8.com/ios-filled/50/000000/mastercard.png" alt="MasterCard">
                    <img src="https://img.icons8.com/ios-filled/50/000000/paypal.png" alt="PayPal">
                </div>
            </div>
    
            <button type="submit" class="btn-book">Confirm Booking</button>
        </form>
    </div>
    

    
    
</div>
