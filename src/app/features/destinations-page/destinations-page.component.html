<ng-template #noData>
  <p>No country details available.</p>
</ng-template>
 <div class="search"  >
  <div  class="search-cont">

    <form class="search-form">

      <div  class="dropdown-group">
        <label for="destination">Destination</label>
        <select class="search-field"  name="destination" id="destination"  [(ngModel)]="filterCriteria.destination" (change)="applyFilters()">
          <option value="">Select Destination</option>
          <option  class="hi" *ngFor="let country of (countries$ | async)" [value]="country.name">{{ country.name }}</option>
        </select>
      </div>

      <div class="dropdown-group">
        <label for="price">Price Range</label>
        <select [(ngModel)]="filterCriteria.price" (change)="applyFilters()"  class="search-field" name="price" id="price">
          <option value="">Price Range</option>
          <option value="10000-15000">10000-15000</option>
          <option value="15000-20000">15000 - 20000</option>
          <option value="20000-25000">20000 - 25000</option>
          <option value="25000+">25000+</option>
        </select>
      </div>

      <div class="dropdown-group">
        <label for="type">Package Type</label>
        <select [(ngModel)]="filterCriteria.type" (change)="applyFilters()" class="search-field" name="type" id="type">
          <option value="">Select Type</option>
          <option value="adventure">Adventure</option>
          <option value="family">Family</option>
          <option value="romantic">Romantic</option>
          <option value="luxury">Luxury</option>
        </select>
      </div>

      <div class="dropdown-group">
        <label for="duration">Duration</label>
        <select [(ngModel)]="filterCriteria.duration" (change)="applyFilters()" class="search-field" name="duration" id="duration">
          <option value="">Duration</option>
          <option value="1-3">1-3 Days</option>
          <option value="4-7">4-7 Days</option>
          <option value="8-14">8-14 Days</option>
          <option value="15+">15+ Days</option>
        </select>
      </div>

    </form>
  

    <button class="reset-btn" (click)="resetFilters()">Reset</button>

  </div>

</div> 



    
    
    <div *ngIf="packages$ | async as packages"  class="package-card">
      <div  *ngFor="let package of packages">

    
      <mat-card appearance="outlined"    class="custom-card">
    
    
        <img mat-card-image src="../../../assets/img2.jpg" alt="Package Image">
    
        <mat-card-content>
          <h3 class="package-name">  {{ package.packageName}}</h3>
    
       
          <div class="price-row">
            <span class="starting-text">Starting From</span>
            <span class="package-price">₹{{ package.amount }}</span>
          </div>
    
   
          <button mat-button class="book-btn">Explore</button>
        </mat-card-content>
    
      </mat-card>
    </div>
    <div
  *ngIf="!loading"
  infiniteScroll
  [infiniteScrollDistance]="scrollDistance"
  [infiniteScrollUpDistance]="scrollUpDistance"
  [infiniteScrollThrottle]="300"

  (scrolled)="loadMorePackages()">
</div>
   
  
    
   

      
    </div>
    <ng-template #noPackages>
      <p>No packages available for this destination.</p>
    </ng-template>



    <app-foot></app-foot>
  </div>
